# Drives the on-attach banner the devbase Feature prints. Sourced as shell, so quote
# values containing spaces.

# Overridden rather than left at the default ("<repository-directory> - development
# environment") because this container is not a development environment for a product
# — naming it after what it actually does prevents it being mistaken for one.
TITLE="RTLDEV Middleware Workspace - cross-repository operations"

# All five are forced off. "auto" would show a group whenever its runtime happens to
# be present, and the base image carries a system python3 — which would advertise a
# Python environment this container does not provide. Language runtimes belong to the
# individual repositories under repos/, each of which ships its own devcontainer.
SHOW_PHP=false
SHOW_NODE=auto
SHOW_GO=false
SHOW_PYTHON=false
SHOW_JAVA=false

# Node is shown because it is real here: prettier, husky and lint-staged run against
# this repository's own files.
NODE_DEPS="prettier husky lint-staged"

# The tools the workspace scripts depend on. A missing version here is the fastest
# read on "why did ws.sh just fail".
EXTRA_ROWS="ripgrep|rg --version|2
gh|gh --version|3
jq|jq --version|
parallel|parallel --version|4"
