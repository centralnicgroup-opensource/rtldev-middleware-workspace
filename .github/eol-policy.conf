# The organisation-wide CI toolchain versions, and what each one is checked against on
# https://endoflife.date.
#
# Sourced as shell by scripts/eol-policy.sh. RSRMID-3029.
#
# This replaces the check that rtldev-middleware-gh-actions-endoflife performed from its
# own check-custom-vars.yml. The values themselves stay where they are — GitHub Actions
# organisation variables — because that is what every workflow in the organisation reads.
# Only the checking moves here.
#
# --- the checks --------------------------------------------------------------
#
# One per line: VARIABLE PRODUCT MIN_CYCLE MAX_CYCLE
#
# MIN_CYCLE and MAX_CYCLE bound the window of release cycles the variable is compared
# against; "-" means unbounded on that side. They are not decoration — a bound is what
# stops the check demanding a version we have decided not to run, and every one below
# names the reason it exists. A bound with no recorded reason is the kind of thing the
# next person deletes as tidying.
#
# MAX_CYCLE also accepts the literal "lts", which is not a cycle name: it resolves at
# runtime to the newest release the product itself marks as long-term support. See the
# note beside the java bounds for why that is admissible where a number is not.
#
# Whether a variable is a single version or a matrix is NOT declared here. It is inferred
# from the value at runtime, exactly as the action did: a value that parses to more than
# one cycle is a matrix. Declaring it twice would let the two disagree.
#
# A PRODUCT written as @OTHER_VARIABLE is not a product name. It says the product is
# whichever one OTHER_VARIABLE currently selects, resolved through POLICY_PRODUCT_MAP
# below. Java is checked that way because the distribution it runs on is itself an
# organisation variable, and the vendors do not share a calendar — the same cycle is
# supported for years longer by one than by another — so a product pinned here would
# start measuring the wrong vendor's dates the moment the variable moved.
POLICY_CHECKS='
RTLDEV_MW_CI_NODE_VERSION   nodejs                     -   24
RTLDEV_MW_CI_NODE_MATRIX    nodejs                     24  24
RTLDEV_MW_CI_GOLANG_VERSION go                         -   -
RTLDEV_MW_CI_GOLANG_MATRIX  go                         -   -
RTLDEV_MW_CI_JAVA_VERSION   @RTLDEV_MW_CI_JAVA_DISTRO  17  lts
RTLDEV_MW_CI_JAVA_MATRIX    @RTLDEV_MW_CI_JAVA_DISTRO  17  lts
RTLDEV_MW_CI_PYTHON_VERSION python                     -   -
RTLDEV_MW_CI_PYTHON_MATRIX  python                     -   -
RTLDEV_MW_CI_PHP_VERSION    php                        8.3 8.3
RTLDEV_MW_CI_PHP_MATRIX     php                        8.3 -
RTLDEV_MW_CI_OS             ubuntu                     -   -
'
# --- resolving an @VARIABLE product ------------------------------------------
#
# One per line: VARIABLE VALUE PRODUCT — the endoflife.date product to check when VARIABLE
# holds VALUE. The left-hand value is an actions/setup-java `distribution:` keyword,
# because feeding that action is what RTLDEV_MW_CI_JAVA_DISTRO exists for.
#
# The table is needed because the two sides are different strings for the same thing and
# no rule turns one into the other: setup-java takes temurin, oracle and oracle-openjdk,
# where endoflife.date calls those eclipse-temurin, oracle-jdk and
# openjdk-builds-from-oracle. Of the sixteen distributions setup-java installs, exactly
# one — sapmachine — spells its product the same on both sides, so concatenating a prefix
# would be a guess dressed as a derivation. That gap is not hypothetical: the java rows
# read oracle-jdk while the variable said temurin, and for as long as that lasted the
# check was measuring Oracle's calendar against a Temurin toolchain.
#
# A value with no line here is a failure, and so is an unset variable. There is no default
# product and no nearest match, because the failure mode being avoided is precisely a
# plausible answer from the wrong vendor. That also makes this table the validation of the
# variable itself: a typo and a real keyword nobody has mapped both stop the run and print
# the value they could not resolve.
#
# Absent on purpose: jetbrains, kona, liberica-nik and jdkfile. endoflife.date tracks no
# product for them, so there is nothing to map them to. Every distribution below does have
# a cycle 17, so the MIN_CYCLE bound on the java rows holds whichever one is selected.
#
# The MAX_CYCLE bound does not travel as well, and that is worth knowing before switching
# distribution. The java rows are bounded by "lts", which reads endoflife.date's isLts flag
# (see the bound notes below), and three of the products mapped here never set it: graalvm-ce, openjdk-builds-from-oracle and redhat-build-of-openjdk. Their
# cycles are all isLts=false, so "lts" resolves to nothing and the run fails rather than
# quietly losing its ceiling. That is the right failure — a vendor that does not say which
# of its releases are long-term is a vendor we cannot hold to an LTS policy — but it is a
# failure, so selecting one of those three means deciding what the java ceiling should be
# instead, in the same change. oracle-graalvm is a milder version of the same thing: it
# marks 17 and 21 LTS and not 25, so "lts" resolves to 21 there and today's value of 25
# would read as above the ceiling.
POLICY_PRODUCT_MAP='
RTLDEV_MW_CI_JAVA_DISTRO corretto          amazon-corretto
RTLDEV_MW_CI_JAVA_DISTRO dragonwell        alibaba-dragonwell
RTLDEV_MW_CI_JAVA_DISTRO graalvm           oracle-graalvm
RTLDEV_MW_CI_JAVA_DISTRO graalvm-community graalvm-ce
RTLDEV_MW_CI_JAVA_DISTRO liberica          bellsoft-liberica
RTLDEV_MW_CI_JAVA_DISTRO microsoft         microsoft-build-of-openjdk
RTLDEV_MW_CI_JAVA_DISTRO oracle            oracle-jdk
RTLDEV_MW_CI_JAVA_DISTRO oracle-openjdk    openjdk-builds-from-oracle
RTLDEV_MW_CI_JAVA_DISTRO redhat            redhat-build-of-openjdk
RTLDEV_MW_CI_JAVA_DISTRO sapmachine        sapmachine
RTLDEV_MW_CI_JAVA_DISTRO semeru            ibm-semeru-runtime
RTLDEV_MW_CI_JAVA_DISTRO temurin           eclipse-temurin
RTLDEV_MW_CI_JAVA_DISTRO zulu              azul-zulu
'
# Both bounds are optional, and "-" is the normal answer for either. They are not defaults
# with exceptions; they are exceptions, and each one that exists should say why.
#
# MAX_CYCLE is set only where something we maintain cannot yet run a newer release that
# already exists — a ceiling imposed on us from outside, never a preference. Where it is
# absent, a newer supported cycle appearing is a prompt to update the variable, which is
# the whole point of the check. Adding a ceiling to silence a report would turn this into a
# job that tells you what you already told it.
#
# The literal "lts" is the one ceiling that is ours rather than imposed, and it is
# admissible only because it does not stop moving. It names no cycle; it resolves each run
# to the newest release the product marks as long-term support, so it cannot silence
# anything for longer than the next LTS takes to ship. A number in its place would be
# today's answer written down as if it were the policy — which is exactly the failure the
# paragraph above describes, arriving a year late. A product that marks no release LTS
# fails the run, and so does one whose newest LTS by release date is not also its newest by
# version — the keyword never degrades to "unbounded" and never guesses between two
# defensible answers.
#
# MIN_CYCLE answers the opposite question and is ours to decide rather than imposed.
# Without a floor, every cycle still supported upstream counts as one a matrix ought to
# contain, so an older release we have deliberately stopped testing reads as missing. The
# floor is where we chose to stop. On a single-version variable it does less, but it still
# earns its place as a guard: it turns a value silently slipping below the floor into a
# reported error rather than something nobody notices.
#
# Why each bound is there:
#
# nodejs, max 24 — our devcontainers run Node LTS. Naming 24 as the ceiling stops the
#   check reporting a current-but-not-LTS major as a version we are behind on. It has to
#   move by hand at the next LTS cutover, and that edit is the point: the cutover is a
#   decision, not something a drift job should make for us. Deliberately not the "lts"
#   keyword the java rows use — the two are the same shape but not the same call, and
#   moving Node onto it means first deciding that the devcontainer cutover should follow
#   upstream rather than wait for us. Settle that on its own before changing this line.
#
# nodejs matrix, min 24 — the build and release process will not run below Node 20, and
#   the matrix floor has since moved to 24 with the toolchain policy in
#   .github/node-policy.conf. Without the floor the check would demand we test on majors
#   nothing we ship supports.
#
# php — the ceiling is WHMCS, not us, and the two variables need different bounds because
#   they answer different questions.
#
#   WHMCS 8 supports no PHP above 8.3 and has not reached end of life, so we cannot yet
#   narrow to WHMCS 9 only, and 8.3 remains the version every module must run on.
#   RTLDEV_MW_CI_PHP_VERSION is therefore pinned to exactly 8.3, min and max: moving off
#   it in either direction is an error rather than an improvement, and a newer PHP being
#   released is not drift we are able to act on.
#
#   The matrix is not a WHMCS question at all, and treating it as one was the mistake that
#   made 8.4 and 8.5 look like drift. A matrix is a test-automation input, and it belongs
#   to the PHP projects that WHMCS does not constrain — php-sdk and any other that supports
#   PHP 8.3 and above. WHMCS either does not test across a matrix or reduces to
#   RTLDEV_MW_CI_PHP_VERSION where it does, so the WHMCS ceiling never applied here.
#
#   Floored at 8.3, which is the floor those projects support, and deliberately left open
#   above: 8.2 is still supported upstream but below that floor, and a genuinely new PHP
#   should surface here as one to consider adding.
#
#   Only the RTLDEV_MW_CI_PHP_VERSION bounds change when WHMCS 8 reaches end of life.
#   https://docs.whmcs.com/PHP_Version_Support_Matrix
#
# java, min 17 — the distributions still support 8 and 11, so without a floor the check
#   reports both as cycles the matrix ought to name. Nothing we ship can run on them:
#   rtldev-middleware-java-sdk's pom.xml sets maven.compiler.source and target to 17, which
#   makes 17 a fact about what we build, not a preference about what we test. It is a floor
#   every distribution in POLICY_PRODUCT_MAP publishes, so it survives a change of vendor.
#
# java, max lts — the Java variables ride the LTS train rather than the six-month
#   release train. A non-LTS cycle reaches end of life every half year and takes the
#   release build and the devcontainer with it; eclipse-temurin 26 did exactly that on
#   2026-09-15, five months after it shipped. So a new non-LTS cycle is not a version we
#   are behind on, and reporting it would be asking to be moved onto the next thing to
#   expire.
#
#   Written as the keyword rather than as 25, because 25 is the answer only until the next
#   LTS. Nothing would have told us when Java 29 shipped around September 2027, and the
#   bound meant to protect the LTS decision would by then be holding the toolchain one LTS
#   behind it. The keyword keeps the check honest in both directions: a non-LTS cycle
#   appearing is not drift, the next LTS appearing is, and a cycle we name reaching end of
#   life still is.
#
#   It is a ceiling and nothing more — it does not make the cycles below it LTS-only. So
#   on the day the next LTS ships, a non-LTS cycle between the floor and the new ceiling
#   that upstream has not yet marked end of life reads as one the matrix is missing. That
#   is the same day the outgoing cycle reaches end of life, so the window is about a day
#   and closes itself; it is not worth a second meaning for the keyword, but it is worth
#   knowing before someone chases a cycle that is about to expire.
#
#   Vendor-portable only up to a point: three products POLICY_PRODUCT_MAP allows publish no
#   isLts flag at all, and "lts" is a failure rather than a ceiling on those. The note above
#   POLICY_PRODUCT_MAP names them.
#
#   The variables themselves cannot hold "lts", only this policy can. actions/setup-java
#   takes a major, a specific version, an early-access suffix or latest, and
#   ghcr.io/devcontainers/features/java takes latest, none or a version; neither has an LTS
#   keyword. The one floating value they do share, latest, is no use here either — the
#   check short-circuits it as clean before it fetches the product, so a variable set to
#   latest is never compared against this ceiling or against any other bound. A value that
#   does not name a cycle leaves this check with nothing to check, which is the opposite of
#   what it is for.
#
# go, python, ubuntu — unbounded on purpose. Nothing external constrains them, so a newer
#   supported cycle really is something we should be moving to.
#
# --- coverage ----------------------------------------------------------------
#
# RTLDEV_MW_CI_OS is checked here and was not checked before. It sets runs-on for every
# workflow in the organisation, including the one that runs this check, so a runner image
# reaching end of life is something we currently discover when a run fails rather than
# beforehand. endoflife.date tracks it as the "ubuntu" product, and the variable holds a
# runner label such as ubuntu-24.04 — see runner_label_to_cycle() in eol-policy.sh for
# how the label is reduced to a release cycle.
POLICY_API_BASE='https://endoflife.date/api/v1/products'
