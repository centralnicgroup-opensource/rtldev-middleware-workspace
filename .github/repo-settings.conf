# Desired GitHub repository settings for the workspace repository.
#
# Same mechanism as in every other rtldev-middleware repository — the file records what
# the settings should be, scripts/repo-settings.sh reconciles them:
#
#   pnpm repo:settings          # report drift, change nothing
#   pnpm repo:settings:apply    # make GitHub match this file
#
# Sourced as shell: quote values with spaces, booleans are bare true/false.

# --- Identity ----------------------------------------------------------------
DESCRIPTION="Workspace for bulk edits and cross-repository operations across the RTLDEV middleware repositories"

HOMEPAGE=""

TOPICS="workspace submodules bulk-operations rtldev middleware"

# Created from the template, so not itself a template.
IS_TEMPLATE=false

# --- Merge behaviour ---------------------------------------------------------
# Squash merging stays off org-wide: it collapses the Conventional Commit messages
# semantic-release reads. This repository publishes nothing, but keeping the setting
# uniform means one answer to "how do we merge here" across all nineteen repositories.
ALLOW_SQUASH_MERGE=false
ALLOW_REBASE_MERGE=true
ALLOW_MERGE_COMMIT=false

ALLOW_AUTO_MERGE=true

DELETE_BRANCH_ON_MERGE=true

# --- Features ----------------------------------------------------------------
# Issues off, and no .github/ISSUE_TEMPLATE/ shipped to match. This repository has no
# external reporters — it is tooling for the middleware team, and the work is tracked
# in Jira (RSRMID) like everything else.
HAS_ISSUES=false
HAS_PROJECTS=false
HAS_WIKI=false
HAS_DISCUSSIONS=false

# --- Security ----------------------------------------------------------------
PRIVATE_VULNERABILITY_REPORTING=true
VULNERABILITY_ALERTS=true
AUTOMATED_SECURITY_FIXES=true
SECRET_SCANNING=true
SECRET_SCANNING_PUSH_PROTECTION=true

# --- Branch protection -------------------------------------------------------
# Left to the organisation ruleset targeting rtldev-middleware-*, which already covers
# this repository by name.
RULESET_ENABLED=false
RULESET_NAME="default-branch-protection"

DEFAULT_BRANCH="main"

REQUIRED_APPROVALS=1
DISMISS_STALE_REVIEWS=true
REQUIRE_LAST_PUSH_APPROVAL=true
REQUIRE_LINEAR_HISTORY=true

REQUIRED_CHECKS="Quality: completed"

# --- Drift check only --------------------------------------------------------
EXPECTED_SECRETS=""
EXPECTED_VARIABLES=""
