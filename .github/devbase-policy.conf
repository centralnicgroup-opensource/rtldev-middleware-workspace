# The one devbase Feature declaration every rtldev-middleware devcontainer is meant to
# carry, and the hand-maintained frame it replaces that must not still be committed.
#
# Sourced as shell by scripts/devbase-policy.sh. Comparison is literal string equality —
# no semver evaluation anywhere, deliberately, for the same reason node-policy.conf gives:
# "these two spellings mean the same thing" is exactly the judgement that let six
# different spellings of engines.node accumulate before anyone noticed.
#
# RSRMID-3073, written after RSRMID-3019: five repositories carried a commit titled
# "build(devcontainer): migrate onto the shared devbase Feature" that added two files and
# declared the Feature in neither of them, unnoticed for two weeks.

# --- the version ---------------------------------------------------------------

# The devbase major every devcontainer.json is meant to declare, e.g.
# ghcr.io/centralnicgroup-opensource/rtldev-middleware-devcontainer-features/devbase:2.
#
# A bare major, not a full version — that is how the Feature is published and how every
# migrated repository pins it: a tag, never a range, so a rebuild always resolves to the
# newest patch of the major named here rather than drifting on its own.
#
# Bump this by hand at the next devbase major, the same way node-policy.conf's Node
# floor moves by hand at the next LTS cutover: a drift job deciding the target itself
# would turn every repository's rebuild into a decision this file never made.
POLICY_DEVBASE_MAJOR='2'

# --- the leftovers devbase replaces ----------------------------------------------

# Files that must not still be committed under .devcontainer/ once a repository is on
# the Feature — devbase supplies every one of them itself. Space-separated basenames,
# matched on the last path segment at ANY depth under .devcontainer/.
#
# Any depth, and not as a precaution: none of the four repositories RSRMID-3019 migrated
# kept these at the top level. go-sdk and java-sdk had .devcontainer/configurations/,
# node-sdk and python-sdk .devcontainer/supporting_files/configuration/. A top-level-only
# check would have passed all four — the exact repositories it exists for.
#
# This is the check that would actually have caught RSRMID-3019: a repository that
# declares the Feature and keeps the frame is *half*-migrated, and declaring the Feature
# is not evidence of having removed what it replaces.
#
#   .zshrc, .czrc                       the shared shell and commitizen configuration
#   .p10k.zsh, p10k-instant-prompt-vscode.zsh
#                                       the powerlevel10k prompt configuration and its
#                                       instant-prompt cache, both keyed to a theme
#                                       devbase now owns
POLICY_LEFTOVER_FILES='.zshrc .czrc .p10k.zsh p10k-instant-prompt-vscode.zsh'

# Substrings that must not appear in a committed Dockerfile-shaped file under
# .devcontainer/ — "Dockerfile" itself, or one starting with "Dockerfile.", at ANY depth,
# the same reasoning as POLICY_LEFTOVER_FILES above: a repository still cloning the prompt
# theme or the shell plugin itself, rather than taking them from the Feature, wherever that
# Dockerfile actually lives. Matched case-insensitively as plain substrings against the
# file content once whole-line `#` comments are stripped — so a migration commit's own
# comment noting these no longer need cloning is never read as the clone it describes the
# removal of — never as a regular expression: both names are ordinary text, and a regex
# here would be a maintenance surface this policy does not need.
POLICY_LEFTOVER_DOCKERFILE_PATTERNS='powerlevel10k zsh-autosuggestions'

# --- coverage --------------------------------------------------------------------

# Repositories this policy has no opinion about, whitespace-separated, full names.
#
# Deliberately separate from repos-exclude.tsv, which scripts/devbase-policy.sh also
# consults through ws_is_excluded — that file is "not part of this workspace at all", and
# a repository can be every bit a part of this workspace and still be one this policy
# should not judge (a devcontainer frame kept deliberately different, for a reason this
# file would record). Empty today: nothing here has earned that exception yet, and the
# node-policy.conf precedent is a caution rather than a template to copy — its
# POLICY_EXCLUDE carries rtldev-middleware-dnscontrol only because that script does not
# read repos-exclude.tsv at all, so it needed its own copy of the same decision. This
# script does read it, so the same repository needs no row here as well.
POLICY_EXCLUDE=''
