# The one Node toolchain declaration every rtldev-middleware repository carries.
#
# Sourced as shell by scripts/node-policy.sh. Values are compared literally against the
# repository's package.json — there is no semver evaluation anywhere, deliberately:
# "these two ranges are equivalent" is exactly the judgement that let six different
# spellings of the same intent accumulate in the first place.
#
# RSRMID-3008.

# --- engines -----------------------------------------------------------------

# Our devcontainers run Node LTS, which is 24 today and becomes 26 at the next cutover,
# so naming both majors now means the switch needs no edit here. Node 22 is deliberately
# absent: nothing we run is on it.
#
# The 24 floor follows php-sdk rather than the more common >=24.10.0 — it is the most
# actively maintained repository and had already moved.
POLICY_ENGINES_NODE='^24.15.0 || ^26.0.0'

# This field is NOT decorative, and it is not a claim that we install with npm.
#
# devbase's devbase_setup_npm_floor (rtldev-middleware-devcontainer-features,
# features/src/devbase/lib/setup.sh) reads .engines.npm out of package.json and runs
# `npm i -g npm@<major>` when the container's npm is older. This field is that
# function's only input, which is why every repository needs it and why it has to stay
# in the `>=` spelling: the parser matches a `>=` prefix and returns early on anything
# else, so `^12.0.0` would silently disable the upgrade rather than fail.
#
# The floor cannot be expressed through POLICY_ENGINES_NODE instead. No Node release
# bundles npm 12 — v24.20.0 and v26.8.1 both ship npm 11.19.0 — so there is no Node
# range that implies it.
POLICY_ENGINES_NPM='>=12.0.0'

# --- the package manager -----------------------------------------------------

# devEngines.packageManager, not packageManager. The two are not interchangeable and we
# deliberately carry only the first:
#
#   packageManager is corepack's field. It takes one exact version, no ranges — the spec
#   forbids them — and pnpm 10+ acts on it silently, downloading and re-executing itself
#   as that exact version. So it is both a treadmill and a surprise: every patch release
#   is a commit in every manifest, and skipping that commit is invisible until you read
#   the file. We have the evidence that this decays. semantic-release-plugins sat at
#   pnpm@10.24.0 and domain-ideas at pnpm@11.15.1 — two exact pins nobody bumped, one a
#   whole major behind, neither reported by anything.
#
#   devEngines.packageManager is the tool-neutral successor. It takes a semver range plus
#   an onFail, and it validates rather than switches: a pnpm outside the range makes the
#   command fail with a message naming the range, instead of quietly becoming a different
#   pnpm. That is the behaviour we want — the developer decides what to install, the
#   manifest decides what is acceptable, and the lockfile decides what actually gets
#   installed.
#
# Corepack is not a reason to keep packageManager either. Node stopped bundling it at
# v25; it is absent from both majors POLICY_ENGINES_NODE names.
#
# The range is a major, so a pnpm patch release needs no commit anywhere. Widening it to
# a new major stays a deliberate bulk change — see RSRMID-3008.
#
# Canonical form, compared literally: '<name>@<version> onFail=<onFail>'.
POLICY_DEV_ENGINES_PACKAGE_MANAGER='pnpm@^11.0.0 onFail=error'

# One consequence to know before migrating a repository: declaring this field makes pnpm
# treat itself as a locked dependency. The next install prepends a packageManagerDependencies
# document to pnpm-lock.yaml resolving pnpm and @pnpm/exe to an exact version, and until
# that document is committed every `pnpm i --frozen-lockfile` fails with "Cannot update
# packageManagerDependencies with frozen-lockfile" — so the manifest edit and the lockfile
# regeneration have to land in the same commit. `manage-package-manager-versions=false`
# does not opt out of it.
#
# That is the arrangement we want rather than a side effect to tolerate: the range lives in
# the manifest where a human states intent, the exact version lives in the lockfile with
# every other exact version, and the dependency refresh job that already bumps the lockfile
# bumps this too. A runner on a different in-range pnpm accepts the lockfile unchanged
# (verified: pnpm 11.24.0 against a lockfile resolved by 11.23.0), so CI is not pinned to
# whichever pnpm the last developer happened to run.

# And packageManager must be absent, not merely ignored.
#
# Carrying both fields means carrying two sources of truth that disagree by design:
# pnpm/action-setup reads devEngines first and packageManager only as a fallback, while
# pnpm's own self-management reads packageManager and never devEngines. A manifest with
# both can therefore run one pnpm in CI and a different one on a laptop, from the same
# commit — which is the exact failure a pinning policy exists to prevent.
POLICY_FORBIDDEN_FIELDS='packageManager'

# --- lockfiles ---------------------------------------------------------------

POLICY_LOCKFILE='pnpm-lock.yaml'

# Any of these at the repository root means someone installed with the wrong tool. They
# are checked for by name rather than inferred from the absence of the pnpm lockfile,
# so that a repository carrying both is reported as carrying both.
POLICY_FORBIDDEN_LOCKFILES='package-lock.json yarn.lock npm-shrinkwrap.json'

# --- coverage ----------------------------------------------------------------

# Repositories this policy has no opinion about, whitespace-separated, full names.
#
# Deliberately NOT derived from .github/repo-settings/_register.tsv. That register
# answers "whose GitHub settings do we manage"; this answers "whose Node toolchain do we
# dictate", and the two only coincide today by accident. Reusing the settings register's
# `exclude` column would make a change there silently change coverage here.
#
# Everything else discovered in the organisation is in scope. A repository with no
# package.json is reported as "not a Node repository" and counted — never silently
# dropped — so a new repository is covered the moment it exists, with nothing to
# register. That is the one structural improvement this check has over the settings
# drift job, which needs its register kept complete by hand.
#
#   rtldev-middleware-dnscontrol  a fork of StackExchange/dnscontrol. Its package.json
#                                 is upstream's, and holding an opinion about it would
#                                 mean carrying a diff we would have to rebase forever.
POLICY_EXCLUDE='rtldev-middleware-dnscontrol'
