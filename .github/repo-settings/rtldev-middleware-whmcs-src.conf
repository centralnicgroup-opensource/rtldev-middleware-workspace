# Overrides for rtldev-middleware-whmcs-src.
#
# Applied on top of _baseline.conf, _profile-internal.conf and
# _profile-releases-via-deploykey.conf.

# REQUIRED_CHECKS stays empty, and this file says so explicitly rather than relying on the
# default, because php-sdk's override sits one directory along and is the obvious thing to
# copy. Nothing here reports on a pull request: build-test.yml is workflow_dispatch and
# workflow_call only, build-release.yml runs on push and release, and the only
# pull_request-triggered workflow is auto-merge-dependabot-pr.yml, which merges rather
# than reports. Naming a required check would therefore leave every pull request
# permanently unmergeable — the case _baseline.conf already warns about. Surveyed on
# 2026-09-02, not inferred.
REQUIRED_CHECKS=""

# The two release identities, asserted rather than assumed. This repository pushes over
# SSH twice with two different keys, and neither push is visible in this workspace:
#
#   RTLDEV_MW_CI_SSH_KEY       the version bump and changelog to this repository's own
#                              main, past its ruleset, as the deploy key named in
#                              RULESET_BYPASS_ACTORS. .releaserc.mjs pins repositoryUrl to
#                              the SSH form for exactly this reason — without the pin,
#                              get-git-auth-url expands package.json's `github:` shortcut
#                              to HTTPS and the push goes out over RTLDEV_MW_CI_TOKEN
#                              instead, never touching the key.
#   RTLDEV_MW_CI_DIST_SSH_KEY  the built bundle to centralnicgroup-opensource's
#                              rtldev-middleware-whmcs, a separate repository in the other
#                              namespace and a separate identity. build-release.yml wires
#                              both.
#
# WHMCSMP_* are the WHMCS Marketplace credentials the release publishes with.
#
# Note that the drift job cannot verify any of this: the CI token cannot read repository
# secrets, so these compare as unreadable there. They are checked by a person running this
# locally with a credential that can — which is the point of writing them down.
EXPECTED_SECRETS="RTLDEV_MW_CI_SSH_KEY RTLDEV_MW_CI_DIST_SSH_KEY WHMCSMP_LOGIN WHMCSMP_PASSWORD"

EXPECTED_VARIABLES="DEBUG GH_REPO WHMCSMP_MINVERSION WHMCSMP_PRODUCTID WHMCS_INSTALLER_CONFIG"
