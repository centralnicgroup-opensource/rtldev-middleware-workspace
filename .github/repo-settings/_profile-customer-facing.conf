# Profile: repositories that ship software our customers use.
#
# The SDKs, the WHMCS and Blesta modules, and the IDN libraries. Someone outside the
# department can install these, hit a bug, and needs somewhere to report it.
#
# Applied on top of _baseline.conf; overridden by any <repository-name>.conf.

# Issues on. A repository in this profile must also ship .github/ISSUE_TEMPLATE/ —
# turning issues on without templates gets us unstructured reports, turning them off
# with templates present leaves those files unreachable.
HAS_ISSUES=true
