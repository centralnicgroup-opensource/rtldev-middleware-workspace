# rtldev-middleware-mcp — private MCP server for domain availability (RSRMID-2947).
#
# Everything else comes from _baseline.conf and the internal + releases-via-deploykey
# profiles; only the two things that have no organisation-wide answer are stated here.

# The aggregate job of .github/workflows/quality.yml, which fans out to Prettier,
# Actionlint and ShellCheck. Named from the job GitHub actually reports on a pull request
# (`ci-success`, name "Quality: completed"), not guessed from the workflow name.
REQUIRED_CHECKS="Quality: completed"

# --- Drift check only --------------------------------------------------------
# The private half of the `semantic-release` deploy key. Named here so its removal is
# reported: without it the release push has no identity, and the ruleset bypass that
# exists for that push would sit there granting nothing.
EXPECTED_SECRETS="RTLDEV_MW_CI_SSH_KEY"
