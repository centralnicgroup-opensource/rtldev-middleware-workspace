# Baseline GitHub repository settings for every rtldev-middleware-* repository.
#
# This is the bottom layer. scripts/org-settings.sh resolves, in order:
#
#   _baseline.conf  ->  _profile-<profile>.conf  ->  <repository-name>.conf
#
# The files are concatenated and sourced as shell, so a later layer overriding an
# earlier one is just a later assignment to the same variable. There is no merge
# algorithm to reason about, and no way for a layer to partially override a value.
#
# Every repository listed in _register.tsv gets this file. A value that genuinely
# differs per repository belongs in a profile (if a class of repositories shares it) or
# in a per-repository file (if it does not) — never here.

# --- Identity ----------------------------------------------------------------
# @unmanaged means "this workspace does not have an opinion; leave whatever GitHub
# holds untouched". It is NOT the same as an empty value, which would blank the field
# on the next apply. Descriptions and topics are per-repository prose, so the baseline
# declines to own them; a repository that wants them managed says so in its own file.
#
# Only DESCRIPTION, HOMEPAGE and TOPICS accept @unmanaged. Every other setting below is
# a policy decision that has one right answer for the whole organisation — that is what
# makes it a baseline — so the script rejects @unmanaged there rather than letting a
# policy quietly opt out.
DESCRIPTION=@unmanaged
HOMEPAGE=@unmanaged
TOPICS=@unmanaged

# Only rtldev-middleware-template is a template, and it overrides this in its own file.
IS_TEMPLATE=false

# --- Merge behaviour ---------------------------------------------------------
# Rebase only. Squash collapses the Conventional Commit messages semantic-release reads
# to pick the next version; merge commits break the linear history the rulesets require.
# This matches CONTRIBUTING.md's documented `gh pr merge --rebase`.
#
# Note this is a real change for most of the organisation: 17 of 25 repositories still
# allow merge commits, because they were never reconciled rather than because anyone
# decided they should. Applying the baseline settles that.
ALLOW_SQUASH_MERGE=false
ALLOW_REBASE_MERGE=true
ALLOW_MERGE_COMMIT=false

# Safe only alongside required status checks. Where a repository has none configured,
# auto-merge means "merge as soon as approvals land", which is still the intent.
ALLOW_AUTO_MERGE=true

DELETE_BRANCH_ON_MERGE=true

# --- Features ----------------------------------------------------------------
# HAS_ISSUES is deliberately absent: it is the one feature that splits by audience, so
# it lives in the profiles. A repository reaching this file without a profile would get
# the script's built-in default, which is why _register.tsv requires a profile column.
HAS_PROJECTS=false
HAS_WIKI=false
HAS_DISCUSSIONS=false

# --- Security ----------------------------------------------------------------
# These are the settings the per-repository model never managed to roll out: secret
# scanning is currently enabled on 1 of 25 repositories. None of them require a file in
# the target repository, which is precisely why they belong here.
#
# Dependabot alerts and security updates are repository settings, not .github/dependabot.yml
# — that file drives routine version updates only. Removing it from a repository does
# not weaken security monitoring; these two toggles are what does.
PRIVATE_VULNERABILITY_REPORTING=true
VULNERABILITY_ALERTS=true
AUTOMATED_SECURITY_FIXES=true

# Free on public repositories. On the internal/private ones (domain-ideas,
# gh-actions-endoflife) this needs GitHub Advanced Security; without it the API rejects
# the change and the script reports it as unreadable rather than counting it as drift.
SECRET_SCANNING=true
SECRET_SCANNING_PUSH_PROTECTION=true

# --- Branch protection -------------------------------------------------------
# Repository-level rulesets, not an organisation ruleset. An org ruleset would be the
# better shape — it covers repositories that do not exist yet — but managing one needs
# organisation-level permissions the CI token does not have, while repository-level
# rulesets work with the repository administration rights it does have.
RULESET_ENABLED=true
RULESET_NAME="default-branch-protection"

# What the classic rules actually are today, surveyed across the organisation:
#   php-sdk      strict + linear history + Lint/Tests required, no pull request required
#   13 others    strict, no linear history, NO required checks, 0 approvals
#   7 repos      no protection at all
# So "require a pull request, require linear history, require checks" is a tightening
# nearly everywhere, not a transcription of what is already in force.
REQUIRE_LINEAR_HISTORY=true

# A pull request is required — no direct pushes to the default branch — but no approving
# review is, which is what every protected repository already does today.
REQUIRED_APPROVALS=0

# Both of these only mean anything alongside a required approval, and REQUIRE_LAST_PUSH_APPROVAL
# actively contradicts REQUIRED_APPROVALS=0: "the most recent push must be approved by
# someone other than the pusher" is an approval requirement wearing a different name, so
# leaving it true would quietly reintroduce the review gate that was just declined.
DISMISS_STALE_REVIEWS=false
REQUIRE_LAST_PUSH_APPROVAL=false

# Signed commits: off until the release pipeline can satisfy it. semantic-release pushes
# release commits through the git CLI, which produces UNSIGNED commits — turning this on
# org-wide today would break releases in every repository that publishes. Commits made
# through the GitHub API are signed by GitHub automatically, so the migration path is to
# move the release commit to an App token and API-based commits, or to give CI a signing
# key, and only then flip this.
REQUIRE_SIGNED_COMMITS=false

# REQUIRED_CHECKS has no organisation-wide answer, and an empty value is deliberate: a
# required check that never reports on a pull request leaves it permanently pending and
# unmergeable, so a wrong guess here is worse than no gating. Set it per repository, from
# the aggregate job name that actually runs on pull requests in that repository.
REQUIRED_CHECKS=""

# --- Drift check only --------------------------------------------------------
EXPECTED_SECRETS=""
EXPECTED_VARIABLES=""
