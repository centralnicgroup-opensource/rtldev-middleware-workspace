# Overrides for rtldev-middleware-template.
#
# Applied on top of _baseline.conf and _profile-internal.conf.

# The one repository where the "Template repository" checkbox is correct — it is what
# puts the "Use this template" button on the page.
#
# Under the central model this is a declared, reviewable exception rather than the
# permanent false-positive it used to be. The template previously shipped IS_TEMPLATE=true
# in the same file its children inherited, so its own weekly drift job could only ever
# report a finding it must not act on. A check with a standing known-false finding is a
# check people stop reading.
IS_TEMPLATE=true

DESCRIPTION="Template Repository to start with"

# Verified against the checks that actually report on this repository's default branch.
REQUIRED_CHECKS="Quality: completed"
