# Profile: the release pushes commits directly to the default branch.
#
# These repositories use @semantic-release/git, which commits the version bump and
# changelog and pushes them to the release branch through the git CLI. That push is made
# by RTLDEV_MW_CI_TOKEN — the same token the release workflow uses.
#
# It works today because the classic branch protection on these repositories has
# enforce_admins=false, and the token's owner is an admin, so branch protection is
# bypassed implicitly.
#
# Rulesets have no such implicit bypass. Applying "require a pull request" here without
# first granting that identity an explicit bypass actor would reject the release push and
# break publishing in every one of these repositories — releases would fail at the last
# step, after the version had already been decided.
#
# So branch protection stays off here until the bypass is configured and verified. Every
# other setting still applies; this profile withholds exactly one thing.
#
# To lift this: add bypass_actors to the ruleset for the release identity (a GitHub App
# installation is the better shape than a PAT), verify a real release completes, then
# remove this profile from the repository's row in _register.tsv.
RULESET_ENABLED=false
