# Overrides for rtldev-middleware-blesta-dev.
#
# Applied on top of _baseline.conf, _profile-internal.conf and
# _profile-releases-via-deploykey.conf.

# REQUIRED_CHECKS stays empty, and this file says so explicitly rather than relying on the
# default. quality.yml is the only pull_request-triggered workflow here and it is still the
# template's, unmodified; naming a check before the release pipeline exists would leave
# every pull request unmergeable — the case _baseline.conf warns about. Revisit when the
# pipeline lands under RSRMID-3059.
REQUIRED_CHECKS=""

# The two release identities, asserted rather than assumed. Both exist as of 2026-09-09
# (RSRMID-3060), each as one write-enabled deploy key with its private half here.
#
#   RTLDEV_MW_CI_SSH_KEY       the version bump and changelog to this repository's own
#                              main, past its ruleset, as the deploy key named in
#                              RULESET_BYPASS_ACTORS. The key is the write-enabled deploy
#                              key `semantic-release` (id 162778376), created with the
#                              secret in the same change — the trait, the key and the
#                              secret land together or not at all.
#   RTLDEV_MW_CI_DIST_SSH_KEY  the built bundle to centralnicgroup-opensource's
#                              rtldev-middleware-blesta, a separate repository in the other
#                              namespace and a separate identity, mirroring what whmcs-src
#                              does with rtldev-middleware-whmcs. Its public half is the
#                              deploy key `distribution-push` (id 162780246) there, which
#                              replaced that repository's own `semantic-release` key in the
#                              same change — added and removed together, because the bypass
#                              is granted to deploy keys as a class and two write keys
#                              would have widened it.
#
# Note that the drift job cannot verify any of this: the CI token cannot read repository
# secrets, so these compare as unreadable there. They are checked by a person running this
# locally with a credential that can — which is the point of writing them down.
EXPECTED_SECRETS="RTLDEV_MW_CI_SSH_KEY RTLDEV_MW_CI_DIST_SSH_KEY"
