# Overrides for rtldev-middleware-idna-uts46.
#
# Applied on top of _baseline.conf and _profile-customer-facing.conf.

# Adopted, not introduced. This repository already enforced this check — a required_status_checks
# rule naming "PR: completed" was set by hand in the web UI, and RSRMID-3077 is what made it
# visible: before it, a check compared only that a ruleset existed, so a rule no configuration
# declared could sit there indefinitely.
#
# Declaring it here is what makes the reported remedy safe. The PUT an apply sends replaces the
# rules array wholesale, so reconciling this repository while the baseline's empty REQUIRED_CHECKS
# still applied would have deleted the only gate on its pull requests.
#
# The name is the surveyed truth: .github/workflows/pr.yml in that repository is named PR and has
# a `completed` aggregate job that runs on pull_request.
#
# One difference remains until the next apply, and it is deliberate: the hand-set rule carries
# strict_required_status_checks_policy=false, where this engine always sends true — as it already
# has on every other repository with required checks. See RSRMID-3078.
REQUIRED_CHECKS="PR: completed"
