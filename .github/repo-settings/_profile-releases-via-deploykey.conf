# Profile: the release pushes commits directly to the default branch, over SSH, with a
# deploy key.
#
# These repositories use @semantic-release/git, which commits the version bump and the
# changelog and pushes them to the release branch through the git CLI. That push cannot
# go through a pull request — it happens after the version has already been decided — so
# the branch protection has to let exactly that one identity past it and nothing else.
#
# The identity is a deploy key with write access, one per repository, whose private half
# is the repository secret RTLDEV_MW_CI_SSH_KEY. A deploy key reaches exactly one
# repository: if one leaks, the blast radius is that repository. The alternatives all had
# a wider reach — a personal access token, a machine user's account key and
# secrets.GITHUB_TOKEN with a bypass on the Actions integration each grant the bypass to
# far more than the release push.
#
# actor_id is empty because GitHub grants this bypass to deploy keys as a class, not to
# one key: the API requires actor_id null for actor_type DeployKey. The consequence is
# that every write-enabled deploy key on the repository can bypass, so a repository
# carrying this profile must have no deploy key beyond the release one.
#
# That invariant used to be verified by hand with `gh repo deploy-key list -R <org>/<repo>`.
# scripts/deploykey-policy.sh now checks it weekly, in both directions: a repository whose
# release config or write deploy key says it belongs here and whose register row does not
# carry this profile is drift, and so is a repository carrying this profile with anything
# other than exactly one write-enabled deploy key. (RSRMID-3035)
#
# bypass_mode always, not pull_request: the release push is not made from a pull request.
# It also exempts the release commit from required_signatures, which is what makes
# REQUIRE_SIGNED_COMMITS reachable on these repositories at all — the unsigned release
# commit is excused, human commits are not.
#
# This profile replaced releases-to-branch, which withheld branch protection entirely
# while no bypass existed. Nine repositories carried this trait as of RSRMID-2994 and
# that profile is deleted, so there is no longer a "not yet migrated" state to be in.
#
# rtldev-middleware-whmcs is the tenth, added under RSRMID-3022. It is the distribution
# repository — built zips and release.json, no source — so the push that needs the bypass
# comes from rtldev-middleware-whmcs-src's release workflow rather than from a
# @semantic-release/git run in the repository itself. The identity is the same: one
# write-enabled deploy key, here named distribution-push, and it is the only key on the
# repository.
#
# Seven of the nine also had classic branch protection removed in the same step, and that
# ordering is not a cleanup that could have waited. Classic protection requires a pull
# request and exempts only admins; a deploy key holds write, never admin, so leaving it in
# place would have rejected exactly the push this profile exists to allow. The swap is a
# tightening either way — the ruleset adds linear history and binds admins too, and their
# classic rules carried no required checks to lose.
RULESET_ENABLED=true
RULESET_BYPASS_ACTORS="DeployKey::always"
