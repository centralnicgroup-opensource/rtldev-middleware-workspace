# Overrides for rtldev-middleware-workspace — this repository.
#
# Applied on top of _baseline.conf and _profile-internal.conf.
#
# Issues stay off from the internal profile, and no .github/ISSUE_TEMPLATE/ ships here
# to match: this is tooling for the middleware team with no external reporters, and the
# work is tracked in Jira (RSRMID).

DESCRIPTION="Workspace for bulk edits and cross-repository operations across the RTLDEV middleware repositories"

TOPICS="workspace submodules bulk-operations rtldev middleware"

# quality.yml's aggregate job, so adding a job to that workflow needs no change here.
# Only consulted when RULESET_ENABLED is true in the baseline.
REQUIRED_CHECKS="Quality: completed"
