# Profile: repositories of internal use only.
#
# Tooling the department runs on itself — this workspace, the devcontainer Features, the
# shareable workflows, the release plugins, the template. Public visibility is not the
# test; having external reporters is. Nobody outside the department has a use case for
# these, and the work on them is tracked in Jira (RSRMID) like everything else.
#
# Applied on top of _baseline.conf; overridden by any <repository-name>.conf.

# Issues off. A repository moving into this profile should have its
# .github/ISSUE_TEMPLATE/ deleted in the same change, so the templates do not linger as
# files nothing can reach.
HAS_ISSUES=false
