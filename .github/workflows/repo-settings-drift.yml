---
# Reports when this repository's GitHub settings no longer match
# .github/repo-settings.conf. Read-only by construction: it runs the script in check
# mode, which never writes. Applying stays manual — see the script's header for why a
# workflow is the wrong place to hold admin rights.
name: Repository settings drift

on:
  schedule:
    # Monday morning, so a drift lands at the start of the week rather than in it.
    - cron: "0 6 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  drift:
    name: Settings drift
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      # GITHUB_TOKEN reads the core settings and topics fine. The security toggles and
      # rulesets need admin, which it does not have — the script reports those as
      # "unreadable" and does not count them as drift, so this job stays honest rather
      # than green-by-omission. Add a REPO_SETTINGS_TOKEN secret (fine-grained, read
      # administration) to cover them too.
      #
      # In this repository the identity fields are {{placeholders}} permanently — it is
      # the template — and are reported as "unconfigured" for the same reason. That is
      # what makes this job runnable here at all, and the settings it does cover apply
      # to the template as much as to anything created from it.
      - name: Check settings against repo-settings.conf
        env:
          GH_TOKEN: ${{ secrets.REPO_SETTINGS_TOKEN || secrets.GITHUB_TOKEN }}
        run: scripts/repo-settings.sh
