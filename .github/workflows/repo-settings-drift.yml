---
# Reports when any rtldev-middleware-* repository's GitHub settings no longer match the
# layered configuration in .github/repo-settings/ — and when one exists in the
# organisation but is absent from _register.tsv.
#
# That second check is the point of running this centrally. A per-repository drift job
# cannot report a repository that never received the job: you cannot detect an absent
# detector from inside the thing that is missing. Enumerating from the GitHub API makes
# an unmanaged repository a failure rather than a silence.
#
# Read-only by construction: it runs in check mode, which never writes. Applying stays
# manual — see scripts/repo-settings.sh for why a workflow is the wrong place to hold
# admin rights over the whole organisation.
name: Repository settings drift

on:
  schedule:
    # Monday morning, so a drift lands at the start of the week rather than in it.
    - cron: "0 6 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  drift:
    name: Settings drift
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      # GITHUB_TOKEN is scoped to THIS repository, so it cannot read the other
      # repositories' settings at all — this job needs an organisation-wide credential to
      # be meaningful. RTLDEV_MW_CI_TOKEN has repository administration rights across the
      # organisation, which covers everything this job reads.
      #
      # Two things that token cannot do, and which are therefore reported as "unreadable"
      # rather than silently passing: organisation-level rulesets, and repository secrets
      # (so EXPECTED_SECRETS / EXPECTED_VARIABLES cannot be verified). That is why branch
      # protection is managed as repository-level rulesets — see _baseline.conf.
      #
      # This job runs check mode, which never writes, so read access is all it needs.
      # Nothing here should ever run --apply: a workflow holding admin over every
      # repository in the organisation is one merged pull request away from reconfiguring
      # all of them.
      - name: Check settings against .github/repo-settings/
        env:
          # One variable per namespace, named after it. A job that spans both namespaces
          # has to be handed both secrets — see the credentials section of
          # scripts/repos.sh for why the second one cannot also be called
          # RTLDEV_MW_CI_TOKEN.
          WS_TOKEN_CENTRALNICGROUP_OPENSOURCE: ${{ secrets.RTLDEV_MW_CI_TOKEN }}
          WS_TOKEN_CENTRALNICGROUP: ${{ secrets.RTLDEV_MW_CI_TOKEN_CNG }}
          # Still set, for the gh calls the engine makes directly once org-settings.sh has
          # handed it a namespace's token — and as the fallback that lets a fork run this.
          GH_TOKEN: ${{ secrets.RTLDEV_MW_CI_TOKEN || secrets.GITHUB_TOKEN }}
        run: scripts/org-settings.sh
